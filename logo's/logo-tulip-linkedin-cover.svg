<svg width="1192" height="220" viewBox="0 0 1192 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient matching brand -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#141820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#212633;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1192" height="220" fill="url(#bgGradient)"/>
  
  <!-- TULIP Logo Text - white for dark background -->
  <text x="596" y="120" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-2.56" text-anchor="middle">
    TULIP<tspan fill="#f4b841">.</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="596" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#9ca3af" letter-spacing="2.4" text-anchor="middle">Asset Management · Czech Republic</text>
</svg>


