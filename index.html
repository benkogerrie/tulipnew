<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tulip Holding s.r.o. | Select Language</title>
    <meta name="description" content="Tulip Holding s.r.o. – Asset Management & Investment in Czech Real Estate">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-accent: #f4b841;
            --color-accent-hover: #e0a837;
            --color-dark: #141820;
            --color-light: #ffffff;
            --color-text: #23272f;
            --color-text-light: #6b7280;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--color-dark) 0%, #212633 100%);
            color: var(--color-light);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .splash-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        .logo {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--color-light);
            letter-spacing: -0.04em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .logo span {
            color: var(--color-accent);
            margin-left: 2px;
        }
        
        .logo-sub {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 60px;
        }
        
        .language-selector {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }
        
        .lang-btn {
            display: block;
            padding: 20px 40px;
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--color-light);
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .lang-btn:hover {
            background-color: var(--color-accent);
            color: var(--color-dark);
            border-color: var(--color-accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(244, 184, 65, 0.3);
        }
        
        .lang-label {
            display: block;
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 4px;
            font-weight: 400;
            text-transform: none;
            letter-spacing: normal;
        }
        
        @media (max-width: 600px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .lang-btn {
                padding: 16px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo">TULIP<span>.</span></div>
        <div class="logo-sub">Asset Management · Czech Republic</div>
        
        <div class="language-selector">
            <a href="en/index.html" class="lang-btn">
                English
                <span class="lang-label">Select English</span>
            </a>
            <a href="de/index.html" class="lang-btn">
                Deutsch
                <span class="lang-label">Deutsch auswählen</span>
            </a>
            <a href="cz/index.html" class="lang-btn">
                Čeština
                <span class="lang-label">Vyberte češtinu</span>
            </a>
        </div>
    </div>
</body>
</html>
